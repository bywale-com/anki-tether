[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anki-tether"
version = "0.1.0"
description = "Personal COIS-1020 study system: official Anki scheduling in a mobile browser, plus a PDF card pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "itsdangerous>=2.2.0",
  "pydantic>=2.9.0",
  "httpx>=0.27.0",
  "pymupdf>=1.24.0",
]

[project.optional-dependencies]
app = ["anki==25.9.4"]
dev = ["pytest>=8.3.0", "httpx>=0.27.0"]

[project.scripts]
anki-tether-pipeline = "pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*", "pipeline*"]
