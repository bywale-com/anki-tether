name: ci

on:
  push:
    paths:
      - "app/**"
      - "pipeline/**"
      - "tests/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "pipeline/**"
      - "tests/**"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[app,dev]"
      - name: Test
        run: pytest
