name: Authored cards

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "cards/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'httpx>=0.27,<1' 'jsonschema>=4.23,<5'
      - run: python -m scripts.authored_cards validate

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: authored-cards-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'httpx>=0.27,<1' 'jsonschema>=4.23,<5'
      - name: Validate and publish authored cards
        env:
          STUDY_APP_URL: ${{ secrets.STUDY_APP_URL }}
          IMPORT_TOKEN: ${{ secrets.IMPORT_TOKEN }}
        run: python -m scripts.authored_cards publish
