name: content-pipeline

on:
  push:
    paths:
      - "source-material/**"
  workflow_dispatch:
    inputs:
      approve_high_confidence:
        description: "Approve deterministic high-confidence cards"
        type: boolean
        default: false
      publish:
        description: "Publish approved cards to the study app"
        type: boolean
        default: false
      force:
        description: "Reparse all PDFs"
        type: boolean
        default: false

concurrency:
  group: content-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline
        run: pip install -e ".[dev]"
      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        with:
          path: pipeline-data
          key: pdf-pipeline-v1-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pdf-pipeline-v1-${{ github.ref }}-
      - name: Ingest, generate, validate
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE_URL: ${{ secrets.AI_API_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python -m pipeline ingest --force
          else
            python -m pipeline ingest
          fi
          python -m pipeline generate
          python -m pipeline validate
          python -m pipeline coverage
      - name: Approve high-confidence drafts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_high_confidence }}
        run: python -m pipeline approve --high-confidence
      - name: Publish approved cards
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          STUDY_APP_URL: ${{ secrets.STUDY_APP_URL }}
          IMPORT_TOKEN: ${{ secrets.IMPORT_TOKEN }}
        run: python -m pipeline publish
      - name: Save pipeline state
        uses: actions/cache/save@v4
        with:
          path: pipeline-data
          key: pdf-pipeline-v1-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload review artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-review-batch
          path: |
            pipeline-data/units
            pipeline-data/drafts
            pipeline-data/reports
            pipeline-data/review_queue.json
            pipeline-data/manifest.json
